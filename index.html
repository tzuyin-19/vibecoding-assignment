  <main class="app-shell">
    <header class="brandline">
      <div class="brandmark"><span class="logo-dot" aria-hidden="true"></span> dream vending machine <span class="brand-dot">·</span> <span>夢境販賣機</span></div>
      <span class="brand-aside">a tiny dream, just for you.</span>
    </header>

    <!-- Screen 01：對話式選單，整個主畫面只有小夢和販賣機 -->
    <section class="screen is-active" id="screen-home" aria-label="選擇夢境">
      <div class="home-room">
        <div class="room-light"></div>
        <div class="room-baseboard"></div>
        <div class="room-floor"></div>
        <div class="home-content">
          <div class="dialogue-card" aria-live="polite">
            <div class="dialogue-heading"><span class="speaking-dot"></span> 小夢說 <span class="dialogue-step" id="home-step">01 / 03</span></div>
            <p class="dialogue-question" id="question">嗨嗨，我是小夢！你今天想去哪裡做夢呢？</p>
            <div class="choices" id="choices"></div>
            <button type="button" class="text-back" id="choice-back" hidden>← 上一題</button>
          </div>
          <div class="character-home" id="character-home">
            <svg viewBox="0 0 220 275" class="mascot-svg" role="img" aria-label="藍色圓滾滾的小夢"><use href="#art-dreamer"/></svg>
          </div>
          <div class="vending-home" id="vending-home">
            <svg viewBox="0 0 310 470" class="vending-svg" role="img" aria-label="可愛的淡紫色夢境販賣機"><use href="#art-vending"/></svg>
            <div class="button-glow" aria-hidden="true"></div>
          </div>
        </div>
        <p class="room-footnote">* 每一段夢，都有一點點不一樣。</p>
      </div>
    </section>

    <!-- Screen 02：抽夢動畫 -->
    <section class="screen" id="screen-draw" aria-label="正在抽取夢境" hidden>
      <div class="draw-panel">
        <p class="eyebrow">DREAM IN PROGRESS</p>
        <h1 class="draw-title">小夢正在幫你準備…</h1>
        <div class="draw-art">
          <svg viewBox="0 0 220 275" class="draw-mascot" aria-hidden="true"><use href="#art-dreamer"/></svg>
          <svg viewBox="0 0 310 470" class="draw-machine" aria-hidden="true"><use href="#art-vending"/></svg>
          <div class="capsule-drop" aria-hidden="true"><div class="capsule-top"></div><div class="capsule-bottom"></div></div>
        </div>
        <div class="mini-dialogue" id="draw-line" aria-live="polite">不知道這次會夢到什麼呢？</div>
        <span class="draw-loading">製作夢境中 <span class="loading-dots">···</span></span>
      </div>
    </section>

    <!-- Screen 03/04：故事與結尾共用舞台 -->
    <section class="screen" id="screen-story" aria-label="夢境動畫" hidden>
      <div class="story-layout">
        <div class="story-header"><div><span class="eyebrow">TONIGHT'S LITTLE DREAM</span><h1 id="story-title">森林裡的小木屋</h1></div><div class="story-number" id="story-number">DREAM 001</div></div>
        <div class="stage" id="stage" data-world="forest" data-phase="intro">
          <svg class="stage-backdrop" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use id="backdrop-use" href="#art-forest"/></svg>
          <div class="stage-warmth" aria-hidden="true"></div>
          <svg viewBox="0 0 220 275" class="story-character" id="story-character" aria-label="小夢"><use href="#art-dreamer"/></svg>
          <svg viewBox="0 0 160 170" class="story-partner" id="story-partner" aria-label="夢境中的小夥伴"><use id="partner-use" href="#prop-lantern"/></svg>
          <div class="dialogue-float from-hero" id="story-bubble" aria-live="polite"></div>
          <div class="stage-caption" id="stage-caption">慢慢走進夢裡……</div>
          <div class="ending-overlay" id="ending-overlay" hidden>
            <div class="ending-inner">
              <span class="ending-seal">✓ DREAM DELIVERED</span>
              <h2>夢境結束啦 ♡</h2>
              <p id="ending-summary"></p>
              <div class="ending-actions"><button id="replay-btn" class="btn btn-main">↻ 再看一次</button><button id="new-btn" class="btn btn-cream">✳ 再抽一個夢</button><button id="home-btn" class="btn btn-link">回到小夢身邊 →</button></div>
            </div>
          </div>
        </div>
        <div class="story-footer"><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div><span id="story-time">00:00 / 00:16</span></div>
      </div>
    </section>
  </main>
</body>
</html>
